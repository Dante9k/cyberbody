      <rect x="164" width="146" height="40" rx="20" fill="#123c61"/><text x="188" y="26" fill="#bae6fd">ACTION PREVIEW</text>
      <rect x="324" width="150" height="40" rx="20" fill="#123c61"/><text x="348" y="26" fill="#bae6fd">HUMAN CONTROL</text>
