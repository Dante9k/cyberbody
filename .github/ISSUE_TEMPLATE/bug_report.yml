name: Bug report
description: Report a reproducible cyberbody defect without private data.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve cyberbody. For security vulnerabilities, stop here and follow SECURITY.md instead of opening a public issue.

  - type: input
    id: version
    attributes:
      label: cyberbody version
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows and display environment
      placeholder: "Windows 11 24H2, 150% scaling, two monitors"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Prefer the bundled deterministic test window and a non-sensitive task.
      placeholder: |
        1. Start cyberbody-test-window
        2. Bind it with the crosshair
        3. Enter ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Paste only the minimum event lines. Never attach a raw session ZIP.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed API keys, credentials, personal paths, screenshots, emails, and account data.
          required: true
        - label: This is not a security vulnerability or confirmation bypass.
          required: true
