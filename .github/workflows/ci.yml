name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts cyberbody_entry.py

      - name: Check formatting
        run: python -m ruff format --check src tests scripts cyberbody_entry.py

      - name: Type check
        run: python -m mypy

      - name: Static security scan
        run: python -m bandit -q -r src -c pyproject.toml

      - name: Privacy scan
        run: python scripts/privacy_audit.py

      - name: Check documentation links
        run: python scripts/check_docs.py

      - name: Test with branch coverage
        run: python -m pytest --cov=cyberbody --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7
